name: Quality

# Runs the project standards on every pull request into main:
#   1. `npm run check` — clean build, Stylelint, html-validate and the
#      review-standards checks (blocking).
#   2. `npm run audit` — axe accessibility, page weight, SEO, links, no-JS
#      and Lighthouse on every page (blocking on FAIL), posted as a PR
#      comment that is updated on each push.
# Thresholds: tools/audit/config.mjs. Guide: .claude/skills/site-audit/SKILL.md
#
# Pull requests only — never on main, so the main deploy stays fast.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # to post/update the audit comment

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Standards check (build + lint + review checks)
        run: npm run check

      - name: Site audit
        id: audit
        # Don't stop here on failure: post the report first, fail after.
        continue-on-error: true
        env:
          # The runner image ships Google Chrome; chrome-launcher uses it.
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run audit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit
          path: _audit/
          if-no-files-found: ignore

      # Sticky comment keyed by a hidden "site-audit" marker, so each push
      # updates this workflow's own comment. (Not `gh pr comment --edit-last`:
      # that edits the bot's latest comment, which can be the PR-preview
      # link posted by the same github-actions bot.)
      - name: Comment audit report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('_audit/report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: site-audit
          path: _audit/report.md

      - name: Fail if the audit failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Site audit has FAIL findings — see the PR comment or the site-audit artifact."
          exit 1
