name: Build and Deploy

# Build the Eleventy site and publish it to GitHub Pages.
# Runs on every push to main, and can be triggered manually.
#
# Deliberately build + publish ONLY, to keep deploys fast: linting, the site
# audit and PR previews run on pull requests (quality.yml, pr-preview.yml),
# never here. Install only `dependencies` (Eleventy); the lint/audit tooling
# lives in `devDependencies` and is skipped with --omit=dev.
#
# Pages serves from the `gh-pages` branch (Settings → Pages → Source =
# "Deploy from a branch", gh-pages, / (root)) rather than "GitHub Actions",
# because the PR previews (pr-preview.yml) live on that same branch under
# pr-preview/pr-<number>/. That's why this pushes to a branch instead of
# using upload-pages-artifact → deploy-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

# One deployment at a time; a newer push cancels an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm # warm npm cache → fast `npm ci` between runs

      - name: Install build dependencies only
        run: npm ci --omit=dev

      - name: Build site
        run: npm run build # Eleventy outputs to _site/

      - name: Publish to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # Keep the open PRs' previews when the main site is replaced.
          clean-exclude: pr-preview/
          # Rebase instead of force-pushing, so a preview pushed at the same
          # moment isn't wiped out.
          force: false
